name: Publicar Camer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      actualizar:
        description: Actualizar mi Space de Camer si ya existe
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publicar-camer
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar el secreto de Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('HF_TOKEN'):
              raise SystemExit('Falta HF_TOKEN. Abre Settings > Secrets and variables > Actions > New repository secret y guarda un token nuevo de Hugging Face con permiso Write.')
          PY
      - name: Descargar el proyecto
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Construir y verificar la versión gratuita
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npm ci --no-audit --no-fund
          npm run build
          python -m pytest -q tests/test_publish.py
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Publicar y comprobar el arranque
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          UPDATE_EXISTING: ${{ inputs.actualizar || github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, 'scripts/publish_space.py']
          if os.environ.get('UPDATE_EXISTING') == 'true':
              command.append('--update')
          raise SystemExit(subprocess.call(command))
          PY
      - name: Probar la detección en la aplicación pública
        env:
          CAMER_APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: |
          if [ -z "$CAMER_APP_URL" ]; then echo 'No se recibió la URL verificada del Space'; exit 1; fi
          npm run test:browser
          printf '### Camer publicado\n\nAbre la aplicación desde tu celular: %s\n' "$CAMER_APP_URL" >> "$GITHUB_STEP_SUMMARY"
